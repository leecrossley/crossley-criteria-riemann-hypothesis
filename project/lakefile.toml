# Lake configuration for the self-contained tree.
# The project README records verification with lake build and tools/build.py.
# Every module is listed in roots because the project modules have no single common prefix.
name = "crossley-rh-classical-route"
defaultTargets = ["RHClassicalRoute"]

[leanOptions]
maxHeartbeats = 6000000
maxRecDepth = 100000

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

